/* ============================================================
   AUTO ARRANGE  (respects pallet spacing AND wall clearance)
============================================================ */
function packAttempt(sortedUnits, gap, transpose, forceOrient){
  // Generic shelf-packer. transpose=false packs shelves ("columns") along the container length;
  // transpose=true packs shelves ("rows") along the container width instead — trying both axis
  // orientations is what lets us catch layouts like "all pallets rotated, packed in rows" that a
  // single fixed strategy would miss. forceOrient locks every unit to one rotation instead of
  // choosing per-unit, which avoids the greedy trap of an early item's rotation boxing out later ones.
  const placementsByContainer = {};
  state.containers.forEach(c=> placementsByContainer[c.id] = []);
  let idx = 0;
  for(const cont of state.containers){
    const spec = CONTAINER_SPECS[cont.type];
    const Lc = (transpose ? spec.W : spec.L) - gap;
    const Wc = (transpose ? spec.L : spec.W) - gap;
    let x = gap;
    while(idx < sortedUnits.length && x < Lc){
      let y = gap, shelfLen = 0, placedAny = false;
      while(idx < sortedUnits.length && y < Wc){
        const u = sortedUnits[idx];
        let opts;
        if(forceOrient==='normal') opts = [{l:u.l,w:u.w}];
        else if(forceOrient==='rotated') opts = [{l:u.w,w:u.l}];
        else opts = [{l:u.l,w:u.w},{l:u.w,w:u.l}];
        let chosen = null;
        for(const o of opts){ if(o.w <= (Wc-y)+0.01 && o.l <= (Lc-x)+0.01){ chosen = o; break; } }
        if(!chosen) break;
        const px = transpose ? y : x, py = transpose ? x : y;
        const pl = transpose ? chosen.w : chosen.l, pw = transpose ? chosen.l : chosen.w;
        placementsByContainer[cont.id].push({ key:u.key, itemNumber:u.itemNumber, instance:u.instance, x:px, y:py, l:pl, w:pw });
        y += chosen.w + gap;
        shelfLen = Math.max(shelfLen, chosen.l);
        placedAny = true;
        idx++;
      }
      if(!placedAny) break;
      x += shelfLen + gap;
    }
  }
  const placedCount = Object.values(placementsByContainer).reduce((s,arr)=> s+arr.length, 0);
  const perContainerArea = state.containers.map(c=> (placementsByContainer[c.id]||[]).reduce((s2,p)=> s2+p.l*p.w, 0));
  const usedArea = perContainerArea.reduce((s,a)=> s+a, 0);
  // sum of squares rewards filling earlier containers as densely as possible rather than
  // spreading pallets evenly across containers when both use the same total footprint area
  const concentration = perContainerArea.reduce((s,a)=> s+a*a, 0);
  return { placementsByContainer, placedCount, usedArea, concentration };
}
function autoArrange(){
  pushUndo();
  const {units} = syncPlacements();
  const gap = spacingMM();
  const sorted = [...units].sort((a,b)=> (b.l*b.w)-(a.l*a.w));

  // Try every combination of shelf axis (columns vs rows) and rotation policy (greedy per-unit,
  // all-normal, all-rotated), then keep whichever packs the most pallets — using total footprint
  // area and then front-loaded concentration as tiebreakers — instead of committing to one fixed heuristic.
  const strategies = [];
  [false, true].forEach(transpose=>{
    [null, 'normal', 'rotated'].forEach(forceOrient=>{
      strategies.push(packAttempt(sorted, gap, transpose, forceOrient));
    });
  });
  let best = strategies[0];
  for(const s of strategies){
    if(s.placedCount>best.placedCount) best = s;
    else if(s.placedCount===best.placedCount){
      if(s.usedArea>best.usedArea) best = s;
      else if(s.usedArea===best.usedArea && s.concentration>best.concentration) best = s;
    }
  }

  state.placements = best.placementsByContainer;
  renderVisual();
}
function clearArrangement(){
  pushUndo();
  state.containers.forEach(c=> state.placements[c.id] = []);
  renderVisual();
}

/* ============================================================
   RENDER: VISUAL PANEL
============================================================ */
function getPalletInstanceHeightMM(item, instance, fallbackH){
  // Resolves the real height for one specific physical pallet instance: box-mode items look up
  // that instance's own bin (since later, partially-filled pallets are often shorter than the
  // first), direct-mode items use a custom height if given, else the general calculation limit
  // rather than the true physical ceiling (which is usually taller than intended).
  if(!item) return fallbackH;
  if(item.mode==='boxes'){
    const c = computeItem(item);
    const bin = (c.bins||[])[instance-1] || (c.bins||[])[0] || null;
    if(bin) return bin.height + PALLET_BASE_HEIGHT_MM;
    if(c.palletHeightMM) return c.palletHeightMM;
    return PALLET_BASE_HEIGHT_MM;
  }
  return (item.palletType==='custom' && +item.customH>0) ? +item.customH : (state.defaultHeightLimit||fallbackH);
}
function renderVisual(){
  const {units, unplaced} = syncPlacements();

  const totalPlaced = units.length - unplaced.length;
  let utilSum = 0, utilCount = 0;
  state.containers.forEach(c=>{
    const spec = CONTAINER_SPECS[c.type];
    const area = spec.L*spec.W;
    const used = (state.placements[c.id]||[]).reduce((s,p)=> s + p.l*p.w, 0);
    utilSum += Math.min(100, (used/area)*100); utilCount++;
  });
  const avgUtil = utilCount ? (utilSum/utilCount) : 0;
  document.getElementById('statsRow').innerHTML = `
    <span>${t('statTotalPallets')}: <b>${units.length}</b></span>
    <span>${t('statPlaced')}: <b>${totalPlaced}</b></span>
    <span>${t('statContainers')}: <b>${state.containers.length}</b></span>
    <span>${t('statUtil')}: <b>${avgUtil.toFixed(0)}%</b></span>
  `;

  const trayList = document.getElementById('trayList');
  trayList.innerHTML = '';
  document.getElementById('trayCount').textContent = unplaced.length ? `${unplaced.length}` : '';
  if(!unplaced.length){
    trayList.innerHTML = `<div class="tray-empty">${t('trayEmpty')}</div>`;
  } else {
    unplaced.forEach(u=>{
      const color = COLOR_PALETTE[(u.itemNumber-1) % COLOR_PALETTE.length];
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.style.background = color;
      chip.dataset.key = u.key;
      chip.textContent = `${u.itemNumber}-${u.instance}`;
      chip.title = `${u.l}×${u.w} mm`;
      attachDrag(chip, {source:'tray', key:u.key, l:u.l, w:u.w, itemNumber:u.itemNumber, instance:u.instance});
      trayList.appendChild(chip);
    });
  }

  const overflowEl = document.getElementById('overflowBanner');
  const totalCapacityArea = state.containers.reduce((s,c)=>{ const sp=CONTAINER_SPECS[c.type]; return s+sp.L*sp.W; },0);
  const totalUnitsArea = units.reduce((s,u)=> s+u.l*u.w, 0);
  if(unplaced.length && totalUnitsArea > totalCapacityArea){
    overflowEl.style.display='flex';
    overflowEl.innerHTML = `⚠ ${t('overflowMsg')}`;
  } else {
    overflowEl.style.display='none';
  }

  const wrap = document.getElementById('containersVisual');
  wrap.innerHTML = '';
  state.containers.forEach((cont, idx)=>{
    const spec = CONTAINER_SPECS[cont.type];
    const gap = spacingMM();
    const block = document.createElement('div');
    block.className = 'container-block';
    const stagePx_W = Math.round(spec.L*SCALE);
    const stagePx_H = Math.round(spec.W*SCALE);
    const placedForUtil = state.placements[cont.id]||[];
    const usedArea = placedForUtil.reduce((s,p)=> s+(p.l*p.w), 0);
    const totalArea = spec.L*spec.W;
    const usedPct = totalArea>0 ? (usedArea/totalArea*100) : 0;
    const freePct = Math.max(0, 100-usedPct);
    block.innerHTML = `
      <div class="container-block-head">
        <div class="title"><span class="num">${idx+1}</span>${t('containerLabel')} ${idx+1} — ${containerTypeName(cont.type)}</div>
        <button type="button" class="btn3d-open" data-c3d="${cont.id}" title="${t('view3dBtn')}">🧊 ${t('view3dBtn')}</button>
        <div class="cap">${t('capacityLabel')}: ${spec.L}×${spec.W} mm</div>
      </div>
      <div class="util-row"><span class="util-used">${usedPct.toFixed(0)}% ${t('utilUsedLabel')}</span><span class="util-free">${freePct.toFixed(0)}% ${t('utilFreeLabel')}</span></div>
      <div class="stage-wrap">
        <div class="stage-dims"><span>${spec.L}×${spec.W} mm</span><span>${t('usableLabel')}: ${(spec.L-2*gap).toFixed(0)}×${(spec.W-2*gap).toFixed(0)} mm</span></div>
        <div class="stage" id="stage_${cont.id}" dir="ltr" style="width:${stagePx_W}px;height:${stagePx_H}px;" data-container-id="${cont.id}"></div>
      </div>
    `;
    wrap.appendChild(block);
    block.querySelector('.btn3d-open').onclick = ()=> openContainer3DModal(cont.id);
    const stageEl = block.querySelector('#stage_'+cont.id);
    (state.placements[cont.id]||[]).forEach(p=>{
      const color = COLOR_PALETTE[(p.itemNumber-1) % COLOR_PALETTE.length];
      const boxItem = state.items[p.itemNumber-1];
      const instanceHeightMM = getPalletInstanceHeightMM(boxItem, p.instance, spec.H);
      const box = document.createElement('div');
      box.className = 'pallet-box';
      box.style.background = color;
      box.style.left = Math.round(p.x*SCALE)+'px';
      box.style.top = Math.round(p.y*SCALE)+'px';
      box.style.width = Math.round(p.l*SCALE)+'px';
      box.style.height = Math.round(p.w*SCALE)+'px';
      box.innerHTML = `<div class="lbl">${p.itemNumber}-${p.instance}</div><div class="sub">${Math.round(p.l)}×${Math.round(p.w)}</div><div class="height-badge" title="${t('heightTooltipLabel')}">↕ ${Math.round(instanceHeightMM)}mm</div><button class="rotate-btn" data-rotate>↻</button>`
        + `<button class="snap-btn snap-left" data-snap="left" title="${t('snapLeftBtn')}">◀</button>`
        + `<button class="snap-btn snap-right" data-snap="right" title="${t('snapRightBtn')}">▶</button>`
        + `<button class="snap-btn snap-up" data-snap="up" title="${t('snapUpBtn')}">▲</button>`
        + `<button class="snap-btn snap-down" data-snap="down" title="${t('snapDownBtn')}">▼</button>`;
      box.dataset.key = p.key;
      box.dataset.containerId = cont.id;
      attachDrag(box, {source:'stage', key:p.key, l:p.l, w:p.w, itemNumber:p.itemNumber, instance:p.instance, origX:p.x, origY:p.y}, cont.id);
      box.querySelector('[data-rotate]').addEventListener('pointerdown', e=>e.stopPropagation());
      box.querySelector('[data-rotate]').addEventListener('click', (e)=>{
        e.stopPropagation();
        const arr = state.placements[cont.id];
        const itemP = arr.find(x=>x.key===p.key);
        const b = usableBounds(cont.id);
        const newL = itemP.w, newW = itemP.l;
        const newX = Math.min(Math.max(itemP.x,b.minX), Math.max(b.minX, b.maxX-newL));
        const newY = Math.min(Math.max(itemP.y,b.minY), Math.max(b.minY, b.maxY-newW));
        const candidate = {x:newX, y:newY, l:newL, w:newW};
        if(isPlacementValid(cont.id, candidate, p.key)){
          pushUndo();
          itemP.l=newL; itemP.w=newW; itemP.x=newX; itemP.y=newY;
          renderVisual();
        } else {
          showToast(t('noRotateMsg'));
          flashStageInvalid(cont.id);
        }
      });
      box.querySelectorAll('[data-snap]').forEach(btn=>{
        btn.addEventListener('pointerdown', e=>e.stopPropagation());
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const pos = computeSnapPosition(cont.id, p.key, btn.dataset.snap);
          if(!pos) return;
          pushUndo();
          const arr = state.placements[cont.id];
          const itemP = arr.find(x=>x.key===p.key);
          itemP.x = pos.x; itemP.y = pos.y;
          renderVisual();
        });
      });
      stageEl.appendChild(box);
    });
  });

  const legendRow = document.getElementById('legendRow');
  legendRow.innerHTML = '';
  if(!state.items.length){
    legendRow.innerHTML = `<div class="hint" style="margin:0;">—</div>`;
  } else {
    state.items.forEach((item, idx)=>{
      const c = computeItem(item);
      const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
      const el = document.createElement('div');
      el.className = 'legend-item';
      el.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>${idx+1}. ${item.description? escapeHtml(item.description): palletTypeName(item)} (${c.palletL||'?'}×${c.palletW||'?'}) — ${c.qty} ${t('itemQtyTag')}`;
      legendRow.appendChild(el);
    });
  }
}

/* ============================================================
   DRAG & DROP (pointer events) with collision + wall-clearance
============================================================ */
function attachDrag(el, payload, currentContainerId){
  el.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const startClientX = e.clientX, startClientY = e.clientY;
    const rect = el.getBoundingClientRect();
    const grabOffsetX = startClientX - rect.left;
    const grabOffsetY = startClientY - rect.top;
    const w = rect.width, h = rect.height;

    const ghost = el.cloneNode(true);
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left+'px';
    ghost.style.top = rect.top+'px';
    ghost.style.width = w+'px';
    ghost.style.height = h+'px';
    ghost.style.margin = '0';
    ghost.style.zIndex = 999;
    ghost.style.pointerEvents = 'none';
    ghost.style.opacity = '0.9';
    ghost.classList.add('dragging');
    document.body.appendChild(ghost);
    el.style.opacity = '0.25';

    function move(ev){
      ghost.style.left = (ev.clientX - grabOffsetX)+'px';
      ghost.style.top = (ev.clientY - grabOffsetY)+'px';
    }
    function up(ev){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      ghost.remove();
      el.style.opacity = '';
      pushUndo();

      const dropTarget = document.elementFromPoint(ev.clientX, ev.clientY);
      const stageEl = dropTarget ? dropTarget.closest('.stage') : null;
      const trayEl = dropTarget ? dropTarget.closest('.tray-list, .tray') : null;

      if(payload.source==='stage'){
        state.placements[currentContainerId] = state.placements[currentContainerId].filter(p=>p.key!==payload.key);
      }
      const restoreOriginal = ()=>{
        if(payload.source==='stage'){
          state.placements[currentContainerId].push({ key:payload.key, itemNumber:payload.itemNumber, instance:payload.instance, x:payload.origX, y:payload.origY, l:payload.l, w:payload.w });
        }
      };

      let flashTarget = null, toastMsg = null;

      if(stageEl){
        const destContId = stageEl.dataset.containerId;
        const b = usableBounds(destContId);
        const stageRect = stageEl.getBoundingClientRect();
        let pxX = ev.clientX - stageRect.left - grabOffsetX;
        let pxY = ev.clientY - stageRect.top - grabOffsetY;
        let x = pxX/SCALE, y = pxY/SCALE;
        x = Math.max(b.minX, Math.min(x, Math.max(b.minX, b.maxX - payload.l)));
        y = Math.max(b.minY, Math.min(y, Math.max(b.minY, b.maxY - payload.w)));

        if(!state.placements[destContId]) state.placements[destContId]=[];
        const candidate = {x,y,l:payload.l,w:payload.w};
        if(isPlacementValid(destContId, candidate)){
          state.placements[destContId].push({ key:payload.key, itemNumber:payload.itemNumber, instance:payload.instance, x, y, l:payload.l, w:payload.w });
        } else {
          const snap = findNearestValidSpot(destContId, payload.l, payload.w, x, y);
          if(snap){
            state.placements[destContId].push({ key:payload.key, itemNumber:payload.itemNumber, instance:payload.instance, x:snap.x, y:snap.y, l:payload.l, w:payload.w });
          } else {
            restoreOriginal();
            flashTarget = destContId;
            toastMsg = t('noSpaceMsg');
          }
        }
      } else if(trayEl){
        // stays unplaced
      } else {
        restoreOriginal();
      }
      renderVisual();
      if(flashTarget) flashStageInvalid(flashTarget);
      if(toastMsg) showToast(toastMsg);
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

/* ============================================================
   HTML SNAPSHOT EXPORT (all entered data, in current language)
============================================================ */
function buildReportHtmlDoc(){
  const dateStr = new Date().toLocaleDateString(state.lang==='he'?'he-IL':'en-GB');
  const dir = state.lang==='he'?'rtl':'ltr';
  let containersHtml = '';
  state.containers.forEach((cont, idx)=>{
    const spec = CONTAINER_SPECS[cont.type];
    const w = Math.round(spec.L*SCALE), h = Math.round(spec.W*SCALE);
    let boxesHtml = '';
    (state.placements[cont.id]||[]).forEach(p=>{
      const color = COLOR_PALETTE[(p.itemNumber-1)%COLOR_PALETTE.length];
      boxesHtml += `<div style="position:absolute;left:${Math.round(p.x*SCALE)}px;top:${Math.round(p.y*SCALE)}px;width:${Math.round(p.l*SCALE)}px;height:${Math.round(p.w*SCALE)}px;background:${color};border:1px solid rgba(0,0,0,.4);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:#111;">${p.itemNumber}-${p.instance}</div>`;
    });
    containersHtml += `
      <div style="margin-bottom:26px;">
        <div style="font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:6px;">${escapeHtml(t('containerLabel'))} ${idx+1} — ${escapeHtml(containerTypeName(cont.type))} (${spec.L}×${spec.W} mm)</div>
        <div dir="ltr" style="position:relative;width:${w}px;height:${h}px;border:2px solid #2f6c80;border-radius:6px;background:#f4f8f9;">${boxesHtml}</div>
      </div>`;
  });
  let rows = '';
  state.items.forEach((item, idx)=>{
    const c = computeItem(item);
    const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
    let boxInfo = '-';
    if(item.mode==='boxes' && !c.invalid){
      boxInfo = `${boxTypesSummaryText(item)} — ${t('calcBoxesPerPallet')}: ${c.boxesPerPallet}, ${t('calcLayers')}: ${c.layers}`;
    }
    rows += `<tr>
      <td style="padding:8px;border-bottom:1px solid #dfe3e2;"><span style="display:inline-block;width:10px;height:10px;background:${color};border-radius:2px;margin-inline-end:6px;"></span>${idx+1}</td>
      <td style="padding:8px;border-bottom:1px solid #dfe3e2;">${escapeHtml(palletTypeName(item))}</td>
      <td style="padding:8px;border-bottom:1px solid #dfe3e2;font-family:monospace;">${c.palletL||'?'}×${c.palletW||'?'}</td>
      <td style="padding:8px;border-bottom:1px solid #dfe3e2;">${escapeHtml(item.description||'-')}</td>
      <td style="padding:8px;border-bottom:1px solid #dfe3e2;font-family:monospace;font-weight:700;">${c.qty}</td>
      <td style="padding:8px;border-bottom:1px solid #dfe3e2;font-family:monospace;font-size:11px;color:#666;">${escapeHtml(boxInfo)}</td>
    </tr>`;
  });
  return `<!DOCTYPE html><html lang="${state.lang}" dir="${dir}"><head><meta charset="UTF-8">
<title>${escapeHtml(t('pdfTitle'))} — ${escapeHtml(state.customerName||'')}</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&family=Assistant:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{font-family:'Assistant',sans-serif;background:#f5f6f5;color:#16211f;margin:0;padding:36px;}
  h1{font-family:'Rubik',sans-serif;font-size:22px;margin:0 0 4px;}
  h2{font-family:'Rubik',sans-serif;font-size:17px;margin-top:30px;}
  .meta{font-size:13px;color:#5a6b68;margin-bottom:24px;}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px;}
  th{text-align:${state.lang==='he'?'right':'left'};padding:8px;background:#eef4f5;}
  .version{margin-top:40px;font-family:monospace;font-size:11px;color:#8a9895;text-align:center;}
</style></head><body>
<h1>${escapeHtml(t('pdfTitle'))}</h1>
<div class="meta">${escapeHtml(t('pdfOrderNumbers'))}: ${escapeHtml(state.orderNumbers||'-')} &nbsp;·&nbsp; ${escapeHtml(t('pdfCustomer'))}: ${escapeHtml(state.customerName||'-')} &nbsp;·&nbsp; ${escapeHtml(t('pdfDate'))}: ${dateStr}</div>
${containersHtml}
<h2>${escapeHtml(t('pdfDetailsTitle'))}</h2>
<table><thead><tr>
  <th>${escapeHtml(t('pdfColItem'))}</th><th>${escapeHtml(t('pdfColType'))}</th><th>${escapeHtml(t('pdfColSize'))}</th><th>${escapeHtml(t('pdfColDesc'))}</th><th>${escapeHtml(t('pdfColQty'))}</th><th>${escapeHtml(t('pdfColBox'))}</th>
</tr></thead><tbody>${rows || `<tr><td colspan="6" style="padding:12px;color:#8a9895;">-</td></tr>`}</tbody></table>
<div class="version">© Stern Engineering LTD · v${APP_VERSION}</div>
<script type="application/json" id="app-state">${JSON.stringify(state).replace(/</g,'\\u003c')}<\/script>
</body></html>`;
}
function downloadHtmlSnapshot(){
  const html = buildReportHtmlDoc();
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${buildBaseFilename()}_v${APP_VERSION}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function downloadStateJson(){
  // Plain JSON export of the full app state (containers, items, placements, settings) — smaller
  // and easier to diff/version than the HTML snapshot, but round-trips through the same loader.
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${buildBaseFilename()}_v${APP_VERSION}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadPackingListCsv(){
  const headers = ['#','Description','PalletType','PalletSize_mm','BoxTypes','BoxesPerPallet','Layers','PalletHeight_mm','PalletsNeeded'];
  const rows = state.items.map((item,idx)=>{
    const c = computeItem(item);
    const dims = getPalletDims(item);
    return [
      idx+1,
      item.description||'',
      palletTypeName(item, true),
      `${dims.l}x${dims.w}`,
      item.mode==='boxes' ? boxTypesSummaryText(item, true) : '-',
      item.mode==='boxes' ? (c.boxesPerPallet||'') : '-',
      item.mode==='boxes' ? (c.layers||'') : '-',
      item.mode==='boxes' ? Math.round(c.palletHeightMM||0) : '-',
      c.qty
    ];
  });
  const csv = [headers, ...rows].map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}); // BOM so Excel reads UTF-8 correctly
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${buildBaseFilename()}_v${APP_VERSION}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function loadStateFromObject(obj){
  if(!obj || !Array.isArray(obj.containers) || !Array.isArray(obj.items) || typeof obj.placements!=='object'){
    throw new Error('invalid-state');
  }
  pushUndo();
  state = obj;
  document.getElementById('orderNumbers').value = state.orderNumbers||'';
  document.getElementById('customerName').value = state.customerName||'';
  document.getElementById('defaultHeightLimit').value = state.defaultHeightLimit||2200;
  document.getElementById('spacingInput').value = state.spacingMM||0;
  applyTheme();
  applyLang();
}
function loadHtmlFile(file){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const text = ev.target.result;
      let obj;
      try {
        // plain JSON export
        obj = JSON.parse(text);
      } catch(_){
        // HTML snapshot with embedded state
        const match = text.match(/<script type="application\/json" id="app-state">([\s\S]*?)<\/script>/);
        if(!match) throw new Error('no-embedded-state');
        obj = JSON.parse(match[1]);
      }
      loadStateFromObject(obj);
      showToast(t('loadSuccessMsg'));
    } catch(err){
      console.error(err);
      alert(t('loadErrorMsg'));
    }
  };
  reader.onerror = ()=> alert(t('loadErrorMsg'));
  reader.readAsText(file);
}

/* ============================================================
   LANGUAGE / THEME
============================================================ */
function applyLang(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{
    el.textContent = t(el.dataset.t);
  });
  document.querySelectorAll('[data-t-ph]').forEach(el=>{
    el.placeholder = t(el.dataset.tPh);
  });
  document.getElementById('langHe').classList.toggle('active', state.lang==='he');
  document.getElementById('langEn').classList.toggle('active', state.lang==='en');
  renderContainersList();
  renderItemsList();
  renderVisual();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeToggle').textContent = state.theme==='dark' ? '🌙' : '☀️';
}

/* ============================================================
   INIT
============================================================ */
document.getElementById('addContainerBtn').onclick = ()=>{
  if(state.containers.length>=5) return;
  pushUndo();
  state.containers.push({id:uid(), type:'20'});
  renderContainersList();
  renderVisual();
};
document.getElementById('addItemBtn').onclick = ()=> openItemModal(null);
document.getElementById('bulkImportBtn').onclick = ()=> openBulkImportModal();
document.getElementById('mergeSelectedBtn').onclick = mergeSelectedItems;
document.getElementById('itemsSearchInput').addEventListener('input', e=>{
  itemsSearchTerm = e.target.value.trim().toLowerCase();
  renderItemsList();
});
document.getElementById('globalOptimizeBtn').onclick = globalOptimize;
document.getElementById('autoArrangeBtn').onclick = autoArrange;
document.getElementById('clearArrangeBtn').onclick = clearArrangement;
document.getElementById('refreshViewBtn').onclick = ()=> renderVisual();
document.getElementById('resetPageBtn').onclick = ()=>{
  if(confirm(t('resetConfirmMsg'))){
    skipAutosave = true; // otherwise the reload's beforeunload handler would re-save the
                          // old in-memory state right back into storage, undoing this reset
    try { localStorage.removeItem('containerPlannerState'); } catch(e){}
    location.reload();
  }
};
document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea') return; // don't hijack normal text editing shortcuts
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
  else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
});
document.getElementById('downloadPdfBtn').onclick = downloadPdf;
document.getElementById('downloadHtmlBtn').onclick = downloadHtmlSnapshot;
document.getElementById('downloadJsonBtn').onclick = downloadStateJson;
document.getElementById('downloadCsvBtn').onclick = downloadPackingListCsv;
document.getElementById('loadHtmlBtn').onclick = ()=> document.getElementById('loadHtmlInput').click();
document.getElementById('loadHtmlInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) loadHtmlFile(file);
  e.target.value = '';
});
function wireUndoableField(id, applyFn){
  const el = document.getElementById(id);
  let pendingSnap = null;
  el.addEventListener('focus', ()=>{ pendingSnap = JSON.stringify(state); });
  el.addEventListener('input', e=> applyFn(e.target.value));
  el.addEventListener('blur', ()=>{
    if(pendingSnap!==null && pendingSnap !== JSON.stringify(state)){
      undoStack.push(pendingSnap);
      if(undoStack.length>UNDO_MAX) undoStack.shift();
      redoStack = [];
      updateUndoRedoButtons();
    }
    pendingSnap = null;
  });
}
wireUndoableField('orderNumbers', v=> state.orderNumbers = v);
wireUndoableField('customerName', v=> state.customerName = v);
wireUndoableField('defaultHeightLimit', v=> state.defaultHeightLimit = +v||2200);
wireUndoableField('spacingInput', v=> { state.spacingMM = Math.max(0, +v||0); renderVisual(); });
document.getElementById('langHe').onclick = ()=>{ state.lang='he'; applyLang(); };
document.getElementById('langEn').onclick = ()=>{ state.lang='en'; applyLang(); };
document.getElementById('themeToggle').onclick = ()=>{ state.theme = state.theme==='dark'?'light':'dark'; applyTheme(); };

let skipAutosave = false;
(function tryRestoreFromLocalStorage(){
  try {
    const saved = localStorage.getItem('containerPlannerState');
    if(saved){
      const wrapper = JSON.parse(saved);
      // only auto-restore state saved by this same app version — otherwise re-downloading a
      // newer version of this file (to the same path/origin) would silently bring back data
      // saved by an older version you were previously testing, which is confusing rather than helpful
      const obj = wrapper && wrapper.__state;
      if(wrapper && wrapper.__savedByVersion===APP_VERSION && obj && Array.isArray(obj.containers) && Array.isArray(obj.items) && typeof obj.placements==='object'){
        state = obj;
        document.getElementById('orderNumbers').value = state.orderNumbers||'';
        document.getElementById('customerName').value = state.customerName||'';
        document.getElementById('defaultHeightLimit').value = state.defaultHeightLimit||2200;
        document.getElementById('spacingInput').value = state.spacingMM||0;
      } else {
        // stale data from a different version — clear it so it doesn't linger and confuse later
        localStorage.removeItem('containerPlannerState');
      }
    }
  } catch(e){ /* corrupt or unavailable storage — just start fresh */ }
})();
function saveToLocalStorage(){
  if(skipAutosave) return;
  try {
    localStorage.setItem('containerPlannerState', JSON.stringify({ __savedByVersion: APP_VERSION, __state: state }));
  } catch(e){ /* storage full/unavailable */ }
}
setInterval(saveToLocalStorage, 4000);
window.addEventListener('beforeunload', saveToLocalStorage);

document.getElementById('versionNum').textContent = APP_VERSION;
applyTheme();
applyLang();
renderContainersList();
renderItemsList();
renderVisual();
</script>
</body>
