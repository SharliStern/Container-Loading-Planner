<style>
:root{
  --bg:#171e26;
  --panel:#202932;
  --panel-2:#28323d;
  --panel-3:#313c48;
  --border:#42505f;
  --border-soft:#38424f;
  --text:#f6f9fb;
  --text-dim:#bccadb;
  --text-faint:#8fa0b2;
  --accent:#6cc6e6;
  --accent-dim:#3d7f95;
  --amber:#f3b263;
  --amber-dim:#9a7233;
  --good:#7fcc9c;
  --bad:#ec7d72;
  --grid-line:rgba(108,198,230,0.16);
  --radius:10px;
  --shadow:0 8px 24px rgba(0,0,0,0.35);
  --font-display:'Rubik',system-ui,sans-serif;
  --font-body:'Assistant',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
[data-theme="light"]{
  --bg:#eef1f0;
  --panel:#ffffff;
  --panel-2:#f6f7f6;
  --panel-3:#eceeed;
  --border:#d7dcda;
  --border-soft:#e1e5e3;
  --text:#16211f;
  --text-dim:#5a6b68;
  --text-faint:#8a9895;
  --accent:#1f7a91;
  --accent-dim:#bfe3ec;
  --amber:#c47a1f;
  --amber-dim:#f2ddb8;
  --good:#2f8f5c;
  --bad:#c14a41;
  --grid-line:rgba(31,122,145,0.10);
  --shadow:0 8px 24px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}
::selection{background:var(--accent-dim);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::placeholder{color:var(--text-faint);opacity:1;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  position:sticky;top:0;z-index:50;
  flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:38px;height:38px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:600;color:#06121a;font-size:13px;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}
.brand-logo{height:42px;width:auto;display:block;}
.brand-text h1{font-family:var(--font-display);font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;color:var(--text);}
.brand-text p{margin:1px 0 0;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.action-btn{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;
  border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  font-family:var(--font-body);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.action-btn:hover{border-color:var(--accent);color:var(--accent);}
.action-btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{
  width:38px;height:38px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:.15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.lang-toggle{
  display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-family:var(--font-mono);font-size:12px;
}
.lang-toggle button{
  background:var(--panel-2);color:var(--text-dim);border:none;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:12px;
}
.lang-toggle button.active{background:var(--accent);color:#06121a;font-weight:700;}

/* ---------- layout ---------- */
.main-grid{
  display:flex;gap:20px;padding:20px 28px 30px;align-items:flex-start;
  max-width:1680px;margin:0 auto;
}
@media (max-width:1100px){
  .main-grid{flex-direction:column;}
}
.panel-input{flex:0 0 420px;min-width:340px;display:flex;flex-direction:column;gap:16px;}
.panel-visual{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);
}
.card h2{
  font-family:var(--font-display);font-size:14px;margin:0 0 4px;
  display:flex;align-items:center;gap:8px;color:var(--text);
  text-transform:uppercase;letter-spacing:.6px;
}
.card h2 .num{
  font-family:var(--font-mono);font-size:11px;color:#1a1200;background:var(--amber);
  width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-weight:700;
}
.card .sub{font-size:12px;color:var(--text-faint);margin:0 0 14px;}

label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:7px;font-family:var(--font-body);font-size:14px;outline:none;
  transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.field{margin-bottom:12px;}
.field-row{display:flex;gap:10px;}
.field-row>.field{flex:1;}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono);}

button{font-family:var(--font-body);cursor:pointer;}
.btn{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121a;}
.btn.primary:hover{filter:brightness(1.08);color:#06121a;}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241701;}
.btn.amber:hover{filter:brightness(1.08);color:#241701;}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent;}
.btn.danger:hover{background:rgba(236,125,114,0.14);border-color:var(--bad);}
.btn.small{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* containers list */
.container-row{
  display:flex;align-items:center;gap:10px;background:var(--panel-2);
  border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;margin-bottom:8px;
}
.container-row .tag{
  font-family:var(--font-mono);font-size:11px;color:var(--bg);background:var(--text-dim);
  width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;
}
.container-row select{width:auto;flex:1;}

/* pallet item cards */
.item-card{
  background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;
  padding:12px;margin-bottom:10px;transition:transform .12s, box-shadow .12s;
}
.item-card.dragging-card{opacity:.4;}
.item-card.drag-over{box-shadow:0 0 0 2px var(--accent-dim) inset;}
.item-card-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.drag-handle{cursor:grab;color:var(--text-faint);font-size:14px;flex-shrink:0;line-height:1;user-select:none;}
.merge-checkbox{flex-shrink:0;width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
.drag-handle:active{cursor:grabbing;}
.item-badge{
  font-family:var(--font-mono);font-size:11px;font-weight:700;color:#0a0a0a;
  width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.item-title{font-weight:700;font-size:13.5px;flex:1;color:var(--text);}
.item-meta{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);margin-inline-start:32px;}
.item-actions{display:flex;gap:4px;}
.item-actions button{background:none;border:none;color:var(--text-faint);font-size:14px;padding:4px 6px;border-radius:5px;}
.item-actions button:hover{color:var(--accent);background:var(--panel-3);}
.item-actions button.del:hover{color:var(--bad);}
.item-calc{
  margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
  display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:12px;font-family:var(--font-mono);color:var(--text-dim);
}
.item-calc b{color:var(--accent);}
.item-calc .warn{color:var(--bad);grid-column:1/-1;}
.item-calc .item-calc-boxtypes{grid-column:1/-1;color:var(--text-faint);}
.pallet-height-breakdown{grid-column:1/-1;}
.height-breakdown-table{border-collapse:collapse;font-family:var(--font-mono);font-size:11px;margin-top:3px;}
.height-breakdown-table th{text-align:start;color:var(--text-faint);font-weight:600;padding:2px 10px 2px 0;border-bottom:1px solid var(--border-soft);}
.height-breakdown-table td{padding:2px 10px 2px 0;color:var(--text);}
.height-breakdown-table td:first-child, .height-breakdown-table th:first-child{color:var(--accent);font-weight:700;}

.mode-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:12px;}
.mode-toggle button{flex:1;background:var(--panel-2);border:none;color:var(--text-dim);padding:8px;font-size:12.5px;font-weight:600;}
.mode-toggle button.active{background:var(--accent-dim);color:#fff;}

.boxtype-row{display:flex;gap:6px;align-items:flex-end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
.boxtype-row .field{flex:1;margin-bottom:0;min-width:0;}
.boxtype-row .field input{width:100%;}
.boxtype-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto;margin-bottom:9px;}
.boxtype-row .rm-btn{flex:0 0 auto;background:var(--panel-2);border:1px solid var(--border);color:var(--bad);border-radius:6px;padding:8px 9px;font-size:12px;cursor:pointer;}
.add-boxtype-btn{background:var(--panel-2);border:1px dashed var(--border);color:var(--accent);border-radius:7px;padding:8px;width:100%;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:2px;}
.calc-viz{margin-top:10px;}
.viz-section-title{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
.layer-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.layer-card{flex:0 0 auto;text-align:center;}
.layer-card .layer-box{border:1.5px solid var(--border);border-radius:4px;}
.layer-card .layer-label{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:4px;white-space:nowrap;}
.layer-label-swatch{display:inline-block;width:7px;height:7px;border-radius:2px;margin-inline-end:2px;vertical-align:middle;}
.items-search{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:13px;}
.items-search::placeholder{color:var(--text-faint);}
.split-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border-soft);font-size:13px;cursor:pointer;}
.split-row input{cursor:pointer;}
.layer-card .layer-fit{font-size:9.5px;color:var(--text-faint);opacity:.8;font-family:var(--font-mono);margin-top:2px;white-space:nowrap;}
.layer-card .layer-dims{font-size:9px;color:var(--text-faint);font-family:var(--font-mono);margin-top:3px;line-height:1.5;text-align:start;}
.pallet-group-block{margin-bottom:14px;padding-bottom:10px;}
.pallet-group-header{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--accent);margin-bottom:4px;}
.pallet-group-count{color:var(--text-faint);font-weight:500;}
.viz-divider{border:none;border-top:1px dashed var(--border-soft);margin:12px 0;}
.stack3d-wrap{display:flex;justify-content:center;padding:0 0 20px;perspective:1000px;box-sizing:content-box;}
.stack3d-scene{position:relative;transform-style:preserve-3d;transform:rotateX(52deg) rotateZ(-28deg);}
.stack3d-layer{position:absolute;left:0;top:0;border:1px solid rgba(0,0,0,.35);border-radius:2px;}

.btn3d-open{background:var(--panel-2);border:1px solid var(--border);color:var(--accent);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn3d-open:hover{background:var(--accent-dim);color:#fff;}
.modal-3d{max-width:760px;}
.view3d-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.view3d-presets button{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:6px 10px;font-size:11.5px;cursor:pointer;}
.view3d-presets button:hover{background:var(--accent-dim);color:#fff;border-color:var(--accent-dim);}
.view3d-viewport{
  width:100%;height:380px;overflow:hidden;border-radius:10px;background:radial-gradient(ellipse at center, #22343a 0%, #0f1a1d 100%);
  display:flex;align-items:center;justify-content:center;perspective:1400px;cursor:grab;user-select:none;touch-action:none;
}
.view3d-viewport.dragging{cursor:grabbing;}
.view3d-world{position:relative;transform-style:preserve-3d;}
.c3d-cube{position:absolute;left:0;top:0;transform-style:preserve-3d;}
.c3d-face{position:absolute;box-sizing:border-box;backface-visibility:visible;}
.view3d-dragnote{text-align:center;font-size:11px;color:var(--text-faint);margin-top:8px;}
.view3d-zoom-group{display:flex;align-items:center;gap:2px;margin-inline-start:auto;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.view3d-zoom-group button{background:var(--panel-2);border:none;border-inline-start:1px solid var(--border);color:var(--text-dim);padding:6px 10px;font-size:12px;cursor:pointer;}
.view3d-zoom-group button:first-child{border-inline-start:none;}
.view3d-zoom-group button:hover{background:var(--accent-dim);color:#fff;}
.view3d-zoom-group button:nth-child(2){font-family:var(--font-mono);font-size:11px;min-width:44px;cursor:default;}
.view3d-zoomwrap{transform-origin:center center;transform-style:preserve-3d;}

.divider-line{height:1px;background:var(--border);margin:12px 0;border:none;}
.empty-note{
  font-size:12.5px;color:var(--text-faint);text-align:center;padding:18px 8px;
  border:1px dashed var(--border);border-radius:8px;
}

/* ---------- visual panel ---------- */
.visual-toolbar-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;}
.visual-toolbar-row .stats{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);display:flex;gap:14px;flex-wrap:wrap;padding-top:4px;}
.visual-toolbar-row .stats span b{color:var(--accent);}
.spacing-compact{display:flex;align-items:center;gap:8px;margin:0 0 8px;}
.spacing-compact label{margin:0;white-space:nowrap;font-size:12.5px;color:var(--text-dim);font-weight:600;}
.spacing-compact input{width:70px;padding:6px 8px;}
.info-dot{color:var(--text-faint);font-size:12px;cursor:help;}
.toolbar-btns{display:flex;gap:8px;flex-wrap:wrap;}

.tray{
  background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
  padding:14px;min-height:76px;
}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.tray-head h3{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:0;text-transform:uppercase;letter-spacing:.5px;}
.tray-list{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;}
.tray-empty{font-size:12.5px;color:var(--text-faint);font-family:var(--font-mono);align-self:center;}

.chip{
  font-family:var(--font-mono);font-size:12px;font-weight:700;
  padding:8px 12px;border-radius:7px;cursor:grab;user-select:none;
  border:1px solid rgba(0,0,0,.25);color:#0c1116;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
  touch-action:none;
}
.chip:active{cursor:grabbing;}

.container-block{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:16px;
}
.container-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.container-block-head .title{font-family:var(--font-display);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--text);}
.container-block-head .title .num{
  font-family:var(--font-mono);font-size:11px;background:var(--text-dim);color:var(--bg);
  width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.container-block-head .cap{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.util-row{display:flex;gap:12px;font-family:var(--font-mono);font-size:12px;font-weight:700;margin-bottom:8px;}
.util-used{color:#6bbf8a;}
.util-free{color:#e2685f;}

.stage-wrap{overflow-x:auto;padding-bottom:6px;}
.stage-dims{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-bottom:4px;display:flex;gap:14px;flex-wrap:wrap;}
.stage{
  position:relative;
  background:
    repeating-linear-gradient(90deg,var(--grid-line) 0,var(--grid-line) 1px,transparent 1px,transparent 24px),
    repeating-linear-gradient(0deg,var(--grid-line) 0,var(--grid-line) 1px,transparent 1px,transparent 24px),
    var(--panel-2);
  border:2px solid var(--accent-dim);
  border-radius:6px;
  box-shadow:inset 0 0 0 4px var(--bg);
  flex-shrink:0;
}
.stage.invalid-flash{animation:stageFlash .65s ease;}
@keyframes stageFlash{
  0%{box-shadow:0 0 0 5px rgba(236,125,114,.75), inset 0 0 0 4px var(--bg);}
  100%{box-shadow:0 0 0 0 rgba(236,125,114,0), inset 0 0 0 4px var(--bg);}
}
.pallet-box{
  position:absolute;border-radius:4px;border:1px solid rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:var(--font-mono);color:#0c1116;font-weight:700;
  box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.25);
  cursor:grab;touch-action:none;user-select:none;
  transition:box-shadow .12s;
}
.pallet-box.dragging{cursor:grabbing;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,.5);opacity:.92;}
.pallet-box .lbl{font-size:12px;line-height:1;}
.pallet-box .sub{font-size:8.5px;opacity:.75;line-height:1;margin-top:2px;}
.pallet-box .height-badge{font-size:8px;opacity:.85;line-height:1;margin-top:1px;font-weight:700;color:#1f2a2d;}
.pallet-box .rotate-btn{
  position:absolute;top:-8px;inset-inline-end:-8px;width:16px;height:16px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:9px;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.pallet-box .snap-btn{
  position:absolute;width:16px;height:16px;
  background:none;border:none;color:rgba(12,17,22,.55);font-size:10px;
  display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;z-index:2;
}
.pallet-box .snap-btn:hover{color:#0c1116;}
.pallet-box .snap-left{top:50%;left:2px;transform:translateY(-50%);}
.pallet-box .snap-right{top:50%;right:2px;transform:translateY(-50%);}
.pallet-box .snap-up{top:2px;left:50%;transform:translateX(-50%);}
.pallet-box .snap-down{bottom:2px;left:50%;transform:translateX(-50%);}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.legend-item{
  display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--font-mono);
  background:var(--panel-2);border:1px solid var(--border-soft);padding:5px 9px;border-radius:6px;color:var(--text-dim);
}
.legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}

.overflow-banner{
  background:rgba(236,125,114,0.14);border:1px solid var(--bad);color:var(--bad);
  border-radius:8px;padding:10px 14px;font-size:12.5px;font-family:var(--font-mono);
  display:flex;align-items:center;gap:8px;
}

.footer-note{text-align:center;color:var(--text-faint);font-size:11.5px;font-family:var(--font-mono);padding:10px 20px 4px;}
.version-tag{text-align:center;color:var(--text-faint);font-size:11.5px;font-family:var(--font-mono);padding:0 20px 22px;letter-spacing:.3px;}
.version-tag b{color:var(--accent);font-weight:700;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--bad);color:#1a0d0b;padding:11px 20px;border-radius:8px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow);z-index:600;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* pdf hidden templates */
#pdf-root{position:fixed;left:-99999px;top:0;width:0;height:0;overflow:hidden;}

/* modal for editing */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:20px;
}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;
  width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
}
.modal h3{font-family:var(--font-display);margin:0 0 14px;font-size:16px;color:var(--text);display:flex;align-items:center;gap:8px;}
.modal-color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.25);}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}

@media(max-width:520px){
  .topbar{padding:12px 14px;}
  .main-grid{padding:14px 14px 20px;}
  .brand-text p{display:none;}
}
</style>

<div class="main-grid">
  <!-- ============ INPUT PANEL ============ -->
  <div class="panel-input">

    <div class="card">
      <h2><span class="num">1</span><span data-t="orderSectionTitle">פרטי הזמנה</span></h2>
      <div class="field">
        <label data-t="orderNumbersLabel">מספר/י הזמנה</label>
        <input type="text" id="orderNumbers" data-t-ph="orderNumbersPh" placeholder="12345, 12346">
      </div>
      <div class="field">
        <label data-t="customerLabel">שם לקוח</label>
        <input type="text" id="customerName" data-t-ph="customerPh" placeholder="שם החברה / הלקוח">
      </div>
    </div>

    <div class="card">
      <h2><span class="num">2</span><span data-t="containersSectionTitle">מכולות</span></h2>
      <p class="sub" data-t="containersSectionSub">בחר כמות המכולות (1–5) והסוג של כל אחת</p>
      <div id="containersList"></div>
      <button class="btn btn-block" id="addContainerBtn" style="margin-top:6px;">
        <span>+</span><span data-t="addContainerBtn">הוסף מכולה</span>
      </button>
    </div>

    <div class="card">
      <h2><span class="num">3</span><span data-t="palletsSectionTitle">משטחים</span></h2>
      <p class="sub" data-t="palletsSectionSub">הוסף כל סוג משטח בנפרד, עם תיאור וכמות</p>
      <div class="field">
        <label data-t="defaultHeightLabel">מגבלת גובה כללית לחישוב (מ״מ)</label>
        <input type="number" id="defaultHeightLimit" value="2200" min="1">
        <div class="hint" data-t="defaultHeightHint">גובה פנימי סטנדרטי של מכולה: כ-2390 מ״מ</div>
      </div>
      <input type="text" id="itemsSearchInput" class="items-search" data-t-ph="itemsSearchPh" placeholder="חיפוש משטחים...">
      <div id="itemsList"></div>
      <div id="itemsEmptyNote" class="empty-note" data-t="noItemsYet">עדיין לא נוספו משטחים</div>
      <button class="btn btn-block" id="mergeSelectedBtn" style="margin-top:8px;display:none;" disabled>
        <span>⛙</span><span id="mergeSelectedBtnLabel" data-t="mergeSelectedBtn">מזג משטחים נבחרים</span>
      </button>
      <button class="btn btn-block primary" id="globalOptimizeBtn" style="margin-top:8px;">
        <span>✨</span><span data-t="globalOptimizeBtn">אופטימיזציה כוללת של כל המשטחים</span>
      </button>
      <button class="btn btn-block amber" id="addItemBtn" style="margin-top:10px;">
        <span>+</span><span data-t="addItemBtn">הוסף משטח</span>
      </button>
      <button class="btn btn-block" id="bulkImportBtn" style="margin-top:8px;">
        <span>📋</span><span data-t="bulkImportBtn">הוספה מרשימת ארגזים</span>
      </button>
    </div>

  </div>

  <!-- ============ VISUAL PANEL ============ -->
  <div class="panel-visual">

    <div class="card">
      <div class="visual-toolbar-row">
        <div>
          <div class="spacing-compact" title="Also applied as clearance from the container walls">
            <label for="spacingInput" data-t="spacingLabel">מרווח (מ״מ)</label>
            <input type="number" id="spacingInput" min="0" step="1" value="5">
            <span class="info-dot" title="Also applied as clearance from the container walls">ⓘ</span>
          </div>
          <div class="stats" id="statsRow"></div>
        </div>
        <div class="toolbar-btns">
          <button class="btn" id="refreshViewBtn" title="Refresh">🔄 <span data-t="refreshViewBtn">רענן תצוגה</span></button>
          <button class="btn" id="clearArrangeBtn" data-t="clearArrangeBtn">נקה סידור</button>
          <button class="btn primary" id="autoArrangeBtn">⚙ <span data-t="autoArrangeBtn">סדר אוטומטית</span></button>
        </div>
      </div>
    </div>

    <div class="tray" id="trayCard">
      <div class="tray-head">
        <h3 data-t="trayTitle">משטחים לא ממוקמים</h3>
        <span class="hint" id="trayCount" style="margin:0;"></span>
      </div>
      <div class="tray-list" id="trayList"></div>
    </div>

    <div id="overflowBanner" class="overflow-banner" style="display:none;"></div>

    <div id="containersVisual"></div>

    <div class="card">
      <h2 style="text-transform:none;letter-spacing:0;"><span data-t="legendTitle">מקרא משטחים</span></h2>
      <div class="legend" id="legendRow"></div>
    </div>

  </div>

const COLOR_PALETTE = ['#f0a848','#57b8d9','#9a8bea','#6bbf8a','#e2685f','#e0c34f','#4fd1c5','#e08fd0','#9fd4f0','#c9a8f0'];
function hexToRgb(hex){
  const h = hex.replace('#','');
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };
}
function rgbToHex(r,g,b){
  const c = v=> Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+c(r)+c(g)+c(b);
}
function shadeColor(hex, amount){
  // amount in [-1,1]: negative blends toward black (darker), positive toward white (lighter)
  const {r,g,b} = hexToRgb(hex);
  const target = amount>=0 ? {r:255,g:255,b:255} : {r:0,g:0,b:0};
  const t = Math.min(1, Math.abs(amount));
  return rgbToHex(r+(target.r-r)*t, g+(target.g-g)*t, b+(target.b-b)*t);
}
function boxTypeShade(baseHex, typeIdx, totalTypes){
  // Gives each box type on the same pallet a distinct shade of the pallet's own base color —
  // e.g. a blue pallet with 3 box types shows light blue / blue / dark blue instead of unrelated colors.
  if(totalTypes<=1) return baseHex;
  const span = -0.32 + (typeIdx/(totalTypes-1)) * 0.64; // spread from -0.32 (darker) to +0.32 (lighter)
  return shadeColor(baseHex, span);
}
function itemColor(idxOrItem){
  const idx = typeof idxOrItem==='number' ? idxOrItem : state.items.indexOf(idxOrItem);
  return COLOR_PALETTE[((idx<0?0:idx)) % COLOR_PALETTE.length];
}

let _uidN = 0;
function uid(){ return 'id'+(++_uidN)+Math.random().toString(36).slice(2,6); }

let state = {
  lang:'he', theme:'dark',
  orderNumbers:'', customerName:'',
  defaultHeightLimit:2200,
  spacingMM:5,
  containers:[ {id:uid(), type:'20'} ],
  items:[],
  placements:{}   // containerId -> [{key,itemNumber,instance,x,y,l,w}]
};

/* ============================================================
   UNDO / REDO HISTORY
   Snapshot-based: pushUndo() is called BEFORE any state-mutating
   action, capturing a deep clone of the current state. Undo pops
   the last snapshot and restores it; redo does the reverse.
============================================================ */
const UNDO_MAX = 40;
let undoStack = [];
let redoStack = [];
function pushUndo(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length>UNDO_MAX) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}
function renderAll(){
  renderContainersList();
  renderItemsList();
  renderVisual();
  document.getElementById('spacingInput').value = state.spacingMM;
  document.getElementById('defaultHeightLimit').value = state.defaultHeightLimit;
  document.getElementById('orderNumbers').value = state.orderNumbers||'';
  document.getElementById('customerName').value = state.customerName||'';
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  const snap = undoStack.pop();
  state = JSON.parse(snap);
  renderAll();
  updateUndoRedoButtons();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  const snap = redoStack.pop();
  state = JSON.parse(snap);
  renderAll();
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  if(undoBtn) undoBtn.disabled = !undoStack.length;
  if(redoBtn) redoBtn.disabled = !redoStack.length;
}

/* ============================================================
   HELPERS
============================================================ */
function getPalletDims(item){
  if(item.palletType==='custom') return {l:+item.customL||0, w:+item.customW||0};
  const pt = PALLET_TYPES[item.palletType];
  return {l:pt.l, w:pt.w};
}
const PALLET_BASE_HEIGHT_MM = 150; // physical height of the wooden pallet base itself
function getBoxTypes(item){
  if(Array.isArray(item.boxTypes) && item.boxTypes.length){
    return item.boxTypes.filter(bt=> +bt.l>0 && +bt.w>0 && +bt.h>0 && +bt.qty>0);
  }
  // migration from legacy single-box-type items
  if(+item.boxL>0 && +item.boxW>0 && +item.boxH>0 && +item.boxQty>0){
    return [{id:'legacy', l:+item.boxL, w:+item.boxW, h:+item.boxH, qty:+item.boxQty}];
  }
  return [];
}
function fitPerLayer(palletL, palletW, l, w){
  const optA = Math.floor(palletL/l)*Math.floor(palletW/w);
  const optB = Math.floor(palletL/w)*Math.floor(palletW/l);
  if(optA>=optB) return {count:optA, rotated:false, cols:Math.floor(palletL/l), rows:Math.floor(palletW/w)};
  return {count:optB, rotated:true, cols:Math.floor(palletL/w), rows:Math.floor(palletW/l)};
}
function buildMixedLayers(perType, palletL, palletW){
  // Recursively splits the pallet footprint (and every leftover rectangle within it) between
  // whichever remaining box type best fits that specific region — a proper guillotine-style
  // split rather than "one filler type per leftover strip", so a layer can combine several
  // products in nested leftover regions instead of stopping after one filler per side.
  const remaining = perType.map(pt=>pt.qty);
  const instances = [];
  let safety = perType.reduce((s,pt)=> s+Math.ceil(pt.qty/Math.max(1,pt.perLayer)), 0) + perType.length + 5;

  function fillRegion(region, composition, heights, depth){
    if(depth<=0 || region.w<=0 || region.d<=0) return;
    let bestIdx=-1, bestArea=-1;
    perType.forEach((pt,i)=>{
      if(remaining[i]<=0) return;
      const fit = fitPerLayer(region.w, region.d, pt.l, pt.w);
      if(fit.count>0 && pt.l*pt.w>bestArea){ bestArea=pt.l*pt.w; bestIdx=i; }
    });
    if(bestIdx===-1) return;
    const t = perType[bestIdx];
    const fit = fitPerLayer(region.w, region.d, t.l, t.w);
    const dimA = fit.rotated ? t.w : t.l, dimB = fit.rotated ? t.l : t.w;
    const placed = Math.min(fit.count, remaining[bestIdx]);
    if(placed<=0) return;
    const usedRows = Math.min(fit.rows, Math.ceil(placed/fit.cols));
    const fullRows = Math.floor(placed/fit.cols);
    const lastRowCount = placed - fullRows*fit.cols;
    const usedL = (usedRows>1 || lastRowCount===0) ? fit.cols*dimA : lastRowCount*dimA;
    const usedD = usedRows*dimB;
    remaining[bestIdx] -= placed;
    composition.push({typeIdx:bestIdx, count:placed, x:region.x, y:region.y, w:usedL, d:usedD});
    heights.push(t.h);
    // recurse into the two leftover rectangles this placement didn't cover
    fillRegion({x:region.x+usedL, y:region.y, w:region.w-usedL, d:region.d}, composition, heights, depth-1);
    fillRegion({x:region.x, y:region.y+usedD, w:usedL, d:region.d-usedD}, composition, heights, depth-1);
  }

  while(remaining.some(r=>r>0) && safety-- > 0){
    const composition = [];
    const heights = [];
    fillRegion({x:0, y:0, w:palletL, d:palletW}, composition, heights, 6);
    if(!composition.length) break; // nothing left fits anywhere on the pallet
    instances.push({height: Math.max(...heights), composition});
  }
  return instances;
}
function computeItem(item){
  const dims = getPalletDims(item);
  if(item.mode==='direct'){
    return {palletL:dims.l, palletW:dims.w, qty:Math.max(0, Math.floor(+item.directQty||0))};
  }
  const boxTypes = getBoxTypes(item);
  const hl = +item.heightLimit||0;
  const usableHeight = Math.max(0, hl - PALLET_BASE_HEIGHT_MM);
  if(!dims.l || !dims.w || !hl || !boxTypes.length){
    return {palletL:dims.l, palletW:dims.w, qty:0, boxesPerLayer:0, layers:0, boxesPerPallet:0, invalid:true, perType:[]};
  }
  // per-type footprint fit (real 2D packing bounded by pallet L x W, best of two orientations)
  const perType = boxTypes.map((bt,i)=>{
    const fit = fitPerLayer(dims.l, dims.w, +bt.l, +bt.w);
    return {idx:i, l:+bt.l, w:+bt.w, h:+bt.h, qty:+bt.qty, perLayer:fit.count, rotated:fit.rotated, cols:fit.cols, rows:fit.rows, fitsFootprint: fit.count>0, fitsHeight: +bt.h<=usableHeight};
  });
  const anyInvalidType = perType.some(pt=> !pt.fitsFootprint || !pt.fitsHeight);
  if(anyInvalidType || usableHeight<=0){
    return {palletL:dims.l, palletW:dims.w, qty:0, boxesPerLayer:0, layers:0, boxesPerPallet:0, invalid:true, perType, baseTooTall: usableHeight<=0};
  }
  // build layer instances — each layer may now mix several box types to use leftover footprint space
  let instances = buildMixedLayers(perType, dims.l, dims.w);
  // First-Fit-Decreasing bin packing by height (within usable height, i.e. minus the pallet base) -> minimizes pallets & keeps each pallet as low/full as possible
  instances.sort((a,b)=> b.height-a.height);
  const bins = [];
  instances.forEach(inst=>{
    let placed = false;
    for(const bin of bins){
      if(bin.height+inst.height <= usableHeight){ bin.items.push(inst); bin.height += inst.height; placed = true; break; }
    }
    if(!placed) bins.push({items:[inst], height:inst.height});
  });
  const firstBin = bins[0] || {items:[], height:0};
  const boxesPerPallet = firstBin.items.reduce((s,it)=> s + it.composition.reduce((s2,c)=>s2+c.count,0), 0);
  const grossHeightMM = firstBin.height + PALLET_BASE_HEIGHT_MM;
  return {
    palletL:dims.l, palletW:dims.w,
    qty: bins.length,
    boxesPerLayer: perType.length===1 ? perType[0].perLayer : boxesPerPallet,
    layers: firstBin.items.length,
    boxesPerPallet,
    palletHeightMM: grossHeightMM,
    stackHeightMM: firstBin.height,
    heightLimitMM: hl,
    exceedsHeightLimit: grossHeightMM > hl,
    perType, bins,
    invalid:false, warnLayers:false
  };
}

function spacingMM(){ return state.spacingMM||0; }

function getAllUnits(){
  let units = [];
  state.items.forEach((item, idx)=>{
    const c = computeItem(item);
    for(let k=1;k<=c.qty;k++){
      units.push({ key:item.id+'#'+k, itemId:item.id, itemNumber:idx+1, instance:k, l:c.palletL, w:c.palletW });
    }
  });
  return units;
}
function syncPlacements(){
  const units = getAllUnits();
  const unitMap = {}; units.forEach(u=>unitMap[u.key]=u);
  const validIds = new Set(state.containers.map(c=>c.id));
  Object.keys(state.placements).forEach(cid=>{
    if(!validIds.has(cid)){ delete state.placements[cid]; return; }
  });
  state.containers.forEach(c=>{ if(!state.placements[c.id]) state.placements[c.id]=[]; });
  Object.keys(state.placements).forEach(cid=>{
    state.placements[cid] = state.placements[cid].filter(p=>unitMap[p.key]);
    // Keep every kept placement's item number and pallet size in sync with the current item list —
    // otherwise editing a pallet's dimensions, or deleting/reordering items, leaves already-placed
    // boxes showing stale size/numbers until manually re-dragged. Rotation is preserved by orientation
    // (portrait vs landscape) rather than raw l/w, since the exact dimensions may have changed.
    state.placements[cid].forEach(p=>{
      const u = unitMap[p.key];
      p.itemNumber = u.itemNumber;
      const wasPortrait = p.l < p.w;
      const newIsPortrait = u.l < u.w;
      if(wasPortrait === newIsPortrait){ p.l = u.l; p.w = u.w; }
      else { p.l = u.w; p.w = u.l; }
    });
  });
  const placedKeys = new Set();
  Object.values(state.placements).forEach(arr=>arr.forEach(p=>placedKeys.add(p.key)));
  const unplaced = units.filter(u=>!placedKeys.has(u.key));
  return {units, unplaced};
}

/* ---------- collision + wall-clearance helpers ---------- */
function rectsOverlap(a,b){
  return a.x < b.x+b.l - 1e-6 && a.x+a.l > b.x + 1e-6 && a.y < b.y+b.w - 1e-6 && a.y+a.w > b.y + 1e-6;
}
function usableBounds(containerId){
  const cont = state.containers.find(c=>c.id===containerId);
  const spec = CONTAINER_SPECS[cont.type];
  const m = spacingMM(); // wall clearance = same value as pallet-to-pallet spacing
  return { minX:m, minY:m, maxX:spec.L-m, maxY:spec.W-m, spec };
}
function isPlacementValid(containerId, candidate, excludeKey){
  const cont = state.containers.find(c=>c.id===containerId);
  if(!cont) return false;
  const b = usableBounds(containerId);
  if(candidate.x < b.minX-0.01 || candidate.y < b.minY-0.01 || candidate.x+candidate.l > b.maxX+0.01 || candidate.y+candidate.w > b.maxY+0.01) return false;
  const gap = spacingMM();
  const others = (state.placements[containerId]||[]).filter(p=> p.key!==excludeKey);
  for(const o of others){
    const inflated = {x:o.x-gap, y:o.y-gap, l:o.l+2*gap, w:o.w+2*gap};
    if(rectsOverlap(candidate, inflated)) return false;
  }
  return true;
}
function computeSnapPosition(containerId, key, direction){
  const b = usableBounds(containerId);
  const gap = spacingMM();
  const arr = state.placements[containerId]||[];
  const self = arr.find(p=>p.key===key);
  if(!self) return null;
  const others = arr.filter(p=>p.key!==key);
  const yOverlaps = o => !(o.y+o.w+gap <= self.y+0.01 || o.y >= self.y+self.w+gap-0.01);
  const xOverlaps = o => !(o.x+o.l+gap <= self.x+0.01 || o.x >= self.x+self.l+gap-0.01);
  if(direction==='left'){
    let bound = b.minX;
    others.forEach(o=>{ if(yOverlaps(o) && o.x+o.l <= self.x+0.01) bound = Math.max(bound, o.x+o.l+gap); });
    return {x:bound, y:self.y};
  }
  if(direction==='right'){
    let bound = b.maxX-self.l;
    others.forEach(o=>{ if(yOverlaps(o) && o.x >= self.x+self.l-0.01) bound = Math.min(bound, o.x-gap-self.l); });
    return {x:bound, y:self.y};
  }
  if(direction==='up'){
    let bound = b.minY;
    others.forEach(o=>{ if(xOverlaps(o) && o.y+o.w <= self.y+0.01) bound = Math.max(bound, o.y+o.w+gap); });
    return {x:self.x, y:bound};
  }
  if(direction==='down'){
    let bound = b.maxY-self.w;
    others.forEach(o=>{ if(xOverlaps(o) && o.y >= self.y+self.w-0.01) bound = Math.min(bound, o.y-gap-self.w); });
    return {x:self.x, y:bound};
  }
  return null;
}
function findNearestValidSpot(containerId, l, w, desiredX, desiredY, excludeKey){
  const b = usableBounds(containerId);
  const step = 5;
  let best=null, bestDist=Infinity;
  const maxX = b.maxX-l, maxY = b.maxY-w;
  if(maxX<b.minX-0.01 || maxY<b.minY-0.01) return null;
  for(let x=b.minX; x<=maxX+0.001; x+=step){
    for(let y=b.minY; y<=maxY+0.001; y+=step){
      const cand = {x:Math.min(x,maxX), y:Math.min(y,maxY), l, w};
      if(isPlacementValid(containerId, cand, excludeKey)){
        const dist = Math.hypot(cand.x-desiredX, cand.y-desiredY);
        if(dist<bestDist){ bestDist=dist; best=cand; }
      }
    }
  }
  [maxX].forEach(x=>[maxY].forEach(y=>{
    const cand={x,y,l,w};
    if(isPlacementValid(containerId,cand,excludeKey)){
      const dist=Math.hypot(x-desiredX,y-desiredY);
      if(dist<bestDist){bestDist=dist;best=cand;}
    }
  }));
  return best;
}

function globalOptimize(){
  const boxItems = state.items.filter(i=> i.mode==='boxes');
  if(boxItems.length<2){ showToast(t('globalOptimizeNeedTwo')); return; }
  const hl = state.defaultHeightLimit;
  const rows = [];
  boxItems.forEach(item=>{
    getBoxTypes(item).forEach(bt=>{
      rows.push({ l:+bt.l, w:+bt.w, h:+bt.h, qty:+bt.qty, description: item.description||palletTypeName(item), fallbackPalletType: item.palletType });
    });
  });
  const beforeTotalPallets = boxItems.reduce((s,item)=> s+computeItem(item).qty, 0);
  const { groups, noFit } = groupRowsOntoSharedPallets(rows, hl);
  const noFitPalletsNeeded = noFit.reduce((s,r)=>{
    const result = computeGroupResult([r], r.fallbackPalletType||'euro', hl);
    return s + (result ? result.qty : 1);
  }, 0);
  const afterTotalPallets = groups.reduce((s,g)=>s+g.qty,0) + noFitPalletsNeeded; // unfit rows fall back to their own pallet(s), unmerged

  if(afterTotalPallets>=beforeTotalPallets){
    showToast(t('globalOptimizeNoChange'));
    return;
  }
  const msg = t('globalOptimizeConfirmMsg').replace('{before}', beforeTotalPallets).replace('{after}', afterTotalPallets);
  if(!confirm(msg)) return;

  pushUndo();
  const directItems = state.items.filter(i=> i.mode!=='boxes');
  const mergedItems = groups.map(g=> ({
    id: uid(), palletType: g.ptKey, description: [...new Set(g.rows.map(r=>r.description))].join(' + '),
    mode:'boxes', boxTypes: g.rows.map(r=> ({id:uid(), l:r.l, w:r.w, h:r.h, qty:r.qty})),
    heightLimit: hl
  }));
  const unfitItems = noFit.map(r=> ({
    id: uid(), palletType: r.fallbackPalletType||'euro', description: r.description,
    mode:'boxes', boxTypes:[{id:uid(), l:r.l, w:r.w, h:r.h, qty:r.qty}],
    heightLimit: hl
  }));
  state.items = [...directItems, ...mergedItems, ...unfitItems];
  renderItemsList();
  renderVisual();
  showToast(t('globalOptimizeSuccessMsg').replace('{before}', beforeTotalPallets).replace('{after}', afterTotalPallets));
}
function openSplitModal(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  const boxTypes = getBoxTypes(item);
  if(boxTypes.length<2) return;

  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${t('splitModalTitle')}</h3>
      <div class="hint" style="margin-bottom:10px;">${t('splitModalHint')}</div>
      <div id="split_rows"></div>
      <div class="modal-actions">
        <button class="btn" id="split_cancel">${t('cancelBtn')}</button>
        <button class="btn primary" id="split_confirm" disabled>${t('splitBtnTitle')}</button>
      </div>
    </div>
  `;
  root.appendChild(overlay);

  const rowsWrap = overlay.querySelector('#split_rows');
  rowsWrap.innerHTML = boxTypes.map((bt,i)=>{
    const color = boxTypeShade(itemColor(item), i, boxTypes.length);
    return `<label class="split-row">
      <input type="checkbox" data-split-idx="${i}">
      <span class="layer-label-swatch" style="background:${color}"></span>
      <span>${bt.l}×${bt.w}×${bt.h} mm ×${bt.qty}</span>
    </label>`;
  }).join('');

  const confirmBtn = overlay.querySelector('#split_confirm');
  rowsWrap.querySelectorAll('[data-split-idx]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const anyChecked = [...rowsWrap.querySelectorAll('[data-split-idx]')].some(x=>x.checked);
      confirmBtn.disabled = !anyChecked;
    });
  });

  confirmBtn.onclick = ()=>{
    const selectedIdx = [...rowsWrap.querySelectorAll('[data-split-idx]')]
      .map((cb,i)=> cb.checked ? i : -1).filter(i=>i>=0);
    if(!selectedIdx.length) return;
    overlay.remove();
    performSplit(itemId, selectedIdx);
  };
  overlay.querySelector('#split_cancel').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
}
function performSplit(itemId, selectedIdx){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  const boxTypes = getBoxTypes(item);
  const selectedSet = new Set(selectedIdx);
  const extracted = boxTypes.filter((bt,i)=> selectedSet.has(i));
  const remaining = boxTypes.filter((bt,i)=> !selectedSet.has(i));
  if(!extracted.length) return;

  const hl = item.heightLimit || state.defaultHeightLimit;
  const ptKeys = Object.keys(PALLET_TYPES).filter(k=>k!=='custom');
  const descParts = (item.description||'').split(' + ');
  const useDescParts = descParts.length===boxTypes.length;

  function bestPalletFor(row){
    let best = null;
    ptKeys.forEach(ptKey=>{
      const result = computeGroupResult([row], ptKey, hl);
      if(!result) return;
      if(!best || result.qty<best.qty || (result.qty===best.qty && result.util>best.util)) best = result;
    });
    return best;
  }

  const newItems = extracted.map((bt)=>{
    const origIdx = boxTypes.indexOf(bt);
    const row = {l:+bt.l, w:+bt.w, h:+bt.h, qty:+bt.qty};
    const best = bestPalletFor(row);
    return {
      id: uid(),
      palletType: best ? best.ptKey : item.palletType,
      description: useDescParts ? descParts[origIdx] : `${item.description||palletTypeName(item)} (${t('splitPartLabel')} ${origIdx+1})`,
      mode:'boxes', boxTypes:[{id:uid(), l:row.l, w:row.w, h:row.h, qty:row.qty}],
      heightLimit: hl
    };
  });

  pushUndo();
  const idx = state.items.indexOf(item);
  if(remaining.length){
    // keep the original item, just with the extracted types removed
    item.boxTypes = remaining.map(bt=> ({...bt}));
    if(useDescParts){
      item.description = boxTypes.map((bt,i)=> descParts[i]).filter((_,i)=> !selectedSet.has(i)).join(' + ');
    }
    state.items.splice(idx+1, 0, ...newItems);
  } else {
    // every type was extracted — nothing left in the original, replace it entirely
    state.items.splice(idx, 1, ...newItems);
  }
  renderItemsList();
  renderVisual();
  showToast(t('splitSuccessMsg').replace('{n}', newItems.length));
}
function mergeSelectedItems(){
  const ids = [...mergeSelection];
  if(ids.length<2){ showToast(t('mergeNeedTwo')); return; }
  const selectedItems = ids.map(id=> state.items.find(i=>i.id===id)).filter(Boolean);
  if(selectedItems.length<2) return;

  // Flatten every selected item's box types into one row list, tagging each with its source
  // description so the merged item's own description can join all of them together.
  const rows = [];
  selectedItems.forEach(item=>{
    getBoxTypes(item).forEach(bt=>{
      rows.push({ l:+bt.l, w:+bt.w, h:+bt.h, qty:+bt.qty, sourceDesc: item.description || palletTypeName(item) });
    });
  });
  const hl = state.defaultHeightLimit;

  // A row whose footprint or height doesn't fit ANY pallet type at all means the merge is
  // fundamentally impossible, regardless of combination with the others.
  const ptKeys = Object.keys(PALLET_TYPES).filter(k=>k!=='custom');
  const impossibleRow = rows.some(r=> !ptKeys.some(k=> rowFitsPalletType(r, k, hl)));
  if(impossibleRow){
    showToast(t('mergeErrorFootprint'));
    return;
  }

  // Try every pallet type on the FULL combined set — if none can hold everything together
  // (i.e. the combined height only fits by splitting across more pallets than makes sense),
  // report the height error rather than silently falling back to a partial merge.
  let best = null;
  ptKeys.forEach(ptKey=>{
    const result = computeGroupResult(rows, ptKey, hl);
    if(!result) return;
    if(!best || result.qty<best.qty || (result.qty===best.qty && result.util>best.util)) best = result;
  });
  if(!best){
    showToast(t('mergeErrorHeight'));
    return;
  }
  // Merging only makes sense if it actually needs fewer pallets than keeping the items separate —
  // if each pallet is already too tall to share space with another, the bin-packer just falls back
  // to one pallet per item again, which isn't a real merge, so treat that as the height failure too.
  const originalTotalPallets = selectedItems.reduce((s,item)=> s + computeItem(item).qty, 0);
  if(best.qty >= originalTotalPallets){
    showToast(t('mergeErrorHeight'));
    return;
  }

  if(!confirm(t('mergeConfirmMsg').replace('{n}', selectedItems.length))) return;

  pushUndo();
  const mergedDescription = [...new Set(rows.map(r=>r.sourceDesc))].join(' + ');
  const mergedItem = {
    id: uid(), palletType:best.ptKey, description: mergedDescription,
    mode:'boxes', boxTypes: rows.map(r=> ({id:uid(), l:r.l, w:r.w, h:r.h, qty:r.qty})),
    heightLimit: hl
  };
  const selectedIdSet = new Set(ids);
  const firstIdx = state.items.findIndex(i=> selectedIdSet.has(i.id));
  state.items = state.items.filter(i=> !selectedIdSet.has(i.id));
  state.items.splice(Math.max(0, Math.min(firstIdx, state.items.length)), 0, mergedItem);
  mergeSelection.clear();
  renderItemsList();
  renderVisual();
  showToast(t('mergeSuccessMsg').replace('{n}', selectedItems.length));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   3D BOX GEOMETRY HELPER (CSS 3D transforms — no external libs)
   Builds a 6-face cuboid of size W(x) x H(y) x D(z), each face an
   absolutely-positioned div. faces param lets each face be styled
   or omitted independently.
============================================================ */
function makeBoxFacesHtml(W,H,D,faces){
  const parts = [];
  if(faces.front)  parts.push(`<div class="c3d-face" style="width:${W}px;height:${H}px;left:0;top:0;transform:translateZ(${D/2}px);${faces.front}"></div>`);
  if(faces.back)   parts.push(`<div class="c3d-face" style="width:${W}px;height:${H}px;left:0;top:0;transform:rotateY(180deg) translateZ(${D/2}px);${faces.back}"></div>`);
  if(faces.right)  parts.push(`<div class="c3d-face" style="width:${D}px;height:${H}px;left:${(W-D)/2}px;top:0;transform:rotateY(90deg) translateZ(${W/2}px);${faces.right}"></div>`);
  if(faces.left)   parts.push(`<div class="c3d-face" style="width:${D}px;height:${H}px;left:${(W-D)/2}px;top:0;transform:rotateY(-90deg) translateZ(${W/2}px);${faces.left}"></div>`);
  if(faces.top)    parts.push(`<div class="c3d-face" style="width:${W}px;height:${D}px;left:0;top:${(H-D)/2}px;transform:rotateX(90deg) translateZ(${H/2}px);${faces.top}"></div>`);
  if(faces.bottom) parts.push(`<div class="c3d-face" style="width:${W}px;height:${D}px;left:0;top:${(H-D)/2}px;transform:rotateX(-90deg) translateZ(${H/2}px);${faces.bottom}"></div>`);
  return parts.join('');
}

const VIEW3D_PRESETS = {
  front:    {rx:-8,  ry:0},
  top:      {rx:-88, ry:0},
  topright: {rx:-32, ry:-42},
  topleft:  {rx:-32, ry:42},
  left:     {rx:-8,  ry:88},
  right:    {rx:-8,  ry:-88}
};

function blendedLayerColor(baseColor, composition, typeCount){
  // Elevation/3D views show height as a single vertical band per layer, which can't show a
  // horizontal split — so a mixed-type layer gets one blended color (weighted by box count)
  // instead of picking just one type's shade arbitrarily.
  if(!composition || !composition.length) return baseColor;
  if(composition.length===1) return boxTypeShade(baseColor, composition[0].typeIdx, typeCount);
  const totalCount = composition.reduce((s,c)=>s+c.count,0) || 1;
  let r=0,g=0,b=0;
  composition.forEach(c=>{
    const shade = boxTypeShade(baseColor, c.typeIdx, typeCount);
    const rgb = hexToRgb(shade);
    const w = c.count/totalCount;
    r += rgb.r*w; g += rgb.g*w; b += rgb.b*w;
  });
  return rgbToHex(r,g,b);
}
function palletFaceOverlayCss(bin, total, ph, baseColor, typeCount){
  // Colors each layer band by its own box type's shade of the pallet's base color (so mixed-type
  // pallets are visibly banded, e.g. light/mid/dark blue), with a wood-colored base band and thin
  // dark seams between layers so the height composition still reads clearly.
  if(!bin || !bin.items || !bin.items.length || !total) return '';
  const stops = [];
  const baseFrac = Math.min(100, (PALLET_BASE_HEIGHT_MM/total*100));
  stops.push(`rgba(90,60,32,.85) 0%`, `rgba(90,60,32,.85) ${baseFrac.toFixed(2)}%`);
  let cum = PALLET_BASE_HEIGHT_MM;
  const seamW = ph>40 ? 0.6 : 1.1; // seam thickness (in %) — thinner when the box reads larger on screen
  bin.items.forEach(inst=>{
    const startFrac = Math.min(100, cum/total*100);
    cum += inst.height;
    const endFrac = Math.min(100, cum/total*100);
    const shade = baseColor ? blendedLayerColor(baseColor, inst.composition, typeCount||1) : 'rgba(0,0,0,0)';
    stops.push(`${shade} ${startFrac.toFixed(2)}%`, `${shade} ${Math.max(startFrac,endFrac-seamW).toFixed(2)}%`, `rgba(0,0,0,.42) ${endFrac.toFixed(2)}%`);
  });
  return `background-image:linear-gradient(to top, ${stops.join(', ')});`;
}
function makePalletBaseNotchesHtml(pl, ph, total, frontZ){
  // wooden pallet base (150mm) drawn with dark forklift-fork entry notches, sitting on the front face
  const baseFracPx = total ? Math.min(ph, (PALLET_BASE_HEIGHT_MM/total)*ph) : Math.min(ph, ph);
  if(baseFracPx<6 || pl<24) return '';
  const notchH = Math.max(2, baseFracPx*0.46);
  const notchY = ph - baseFracPx + (baseFracPx-notchH)/2;
  const notchW = Math.min(pl*0.16, 14);
  const gap = pl*0.24;
  const cx = pl/2;
  const xs = [cx-gap-notchW/2, cx-notchW/2, cx+gap-notchW/2].filter(x=> x>2 && x+notchW<pl-2);
  const use = pl>70 ? xs : [xs[0], xs[xs.length-1]]; // fewer notches when the pallet reads small on screen
  return use.map(x=> `<div class="c3d-face" style="width:${notchW}px;height:${notchH}px;left:${x}px;top:${notchY}px;transform:translateZ(${frontZ+0.6}px);background:rgba(15,10,6,.8);border-radius:1px;"></div>`).join('');
}
function openContainer3DModal(containerId){
  const cont = state.containers.find(c=>c.id===containerId);
  if(!cont) return;
  const spec = CONTAINER_SPECS[cont.type];
  const idx = state.containers.indexOf(cont);

  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal modal-3d">
      <h3>${t('containerLabel')} ${idx+1} — ${containerTypeName(cont.type)} · ${t('view3dTitle')}</h3>
      <div class="view3d-presets">
        <button type="button" data-view="front">${t('viewFront')}</button>
        <button type="button" data-view="top">${t('viewTop')}</button>
        <button type="button" data-view="topright">${t('viewTopRight')}</button>
        <button type="button" data-view="topleft">${t('viewTopLeft')}</button>
        <button type="button" data-view="left">${t('viewLeft')}</button>
        <button type="button" data-view="right">${t('viewRight')}</button>
        <span class="view3d-zoom-group">
          <button type="button" id="c3d-zoom-out" title="${t('zoomOutBtn')}">−</button>
          <button type="button" id="c3d-zoom-reset" title="${t('zoomResetBtn')}">100%</button>
          <button type="button" id="c3d-zoom-in" title="${t('zoomInBtn')}">+</button>
        </span>
      </div>
      <div class="view3d-viewport" id="view3d-viewport">
        <div class="view3d-zoomwrap" id="view3d-zoomwrap">
          <div class="view3d-world" id="view3d-world"></div>
        </div>
      </div>
      <div class="view3d-dragnote">${t('view3dDragHint')} · ${t('view3dZoomHint')}</div>
      <div class="view3d-dragnote">${t('view3dLimitLineNote')}</div>
      <div class="modal-actions">
        <button class="btn" id="c3d-close">${t('closeBtn')}</button>
      </div>
    </div>
  `;
  root.appendChild(overlay);

  const world = overlay.querySelector('#view3d-world');
  const zoomWrap = overlay.querySelector('#view3d-zoomwrap');
  const viewport = overlay.querySelector('#view3d-viewport');
  const zoomLabel = overlay.querySelector('#c3d-zoom-reset');

  // ---- scale everything uniformly so all proportions (L, W, H, and every pallet's own height) are true to life
  const VIEW_MAX = 300;
  const maxDim = Math.max(spec.L, spec.W, spec.H);
  const scale = VIEW_MAX / maxDim;
  const Lpx = spec.L*scale, Wpx = spec.W*scale, Hpx = spec.H*scale;

  world.style.width = Lpx+'px';
  world.style.height = Hpx+'px';

  // container shell: floor solid, walls lightly transparent (so pallets show through), roof semi-transparent
  let html = `<div class="c3d-cube" style="width:${Lpx}px;height:${Hpx}px;">`
    + makeBoxFacesHtml(Lpx,Hpx,Wpx,{
        front:  'background:rgba(120,170,190,.08);border:1px solid rgba(160,210,230,.35);',
        back:   'background:rgba(120,170,190,.08);border:1px solid rgba(160,210,230,.35);',
        left:   'background:rgba(120,170,190,.05);border:1px solid rgba(160,210,230,.3);',
        right:  'background:rgba(120,170,190,.05);border:1px solid rgba(160,210,230,.3);',
        top:    'background:rgba(160,210,230,.14);border:1px solid rgba(160,210,230,.4);',
        bottom: 'background:rgba(40,55,58,.9);border:1px solid rgba(160,210,230,.3);'
      })
    + `</div>`;

  // pallets inside, positioned & sized in true proportion (same scale for x, y, height)
  const gap = spacingMM();
  const heightLimitLines = new Map(); // itemId -> {mmLimit, color} — drawn once per distinct item, as a visual proof-check against the computed pallet height
  (state.placements[cont.id]||[]).forEach(p=>{
    const item = state.items[p.itemNumber-1];
    let heightMM = state.defaultHeightLimit||spec.H; // used only when the item can't be found or truly has no calculated height (direct mode)
    let bin = null, binTotal = 0, typeCount = 1;
    if(item){
      if(item.mode==='boxes'){
        const c = computeItem(item);
        typeCount = (c.perType||[]).length || 1;
        bin = (c.bins||[])[p.instance-1] || (c.bins||[])[0] || null;
        if(bin){
          binTotal = bin.height + PALLET_BASE_HEIGHT_MM;
          heightMM = binTotal;
        } else if(c.palletHeightMM){
          // calc exists but this specific instance's bin was missing for some reason — use the general pallet height rather than silently filling to the ceiling
          heightMM = c.palletHeightMM;
        } else {
          heightMM = PALLET_BASE_HEIGHT_MM;
        }
        const hl = +item.heightLimit||0;
        if(hl>0 && !heightLimitLines.has(item.id)){
          heightLimitLines.set(item.id, {mm:hl, color: COLOR_PALETTE[(p.itemNumber-1) % COLOR_PALETTE.length]});
        }
      } else {
        // direct-quantity pallets have no calculated box height — a custom-pallet height overrides if the user gave one,
        // otherwise fall back to the general calculation height limit (not necessarily the true physical ceiling)
        heightMM = (item.palletType==='custom' && +item.customH>0) ? +item.customH : (state.defaultHeightLimit||spec.H);
        if(heightMM>0 && !heightLimitLines.has(item.id)){
          heightLimitLines.set(item.id, {mm:heightMM, color: COLOR_PALETTE[(p.itemNumber-1) % COLOR_PALETTE.length]});
        }
      }
    }
    const pl = p.l*scale, pw = p.w*scale, ph = Math.max(2, heightMM*scale);
    const xPx = p.x*scale;
    const zCenter = Wpx/2 - (p.y*scale + pw/2);
    const yTop = Hpx - ph; // sits on the floor, extends up to its actual height
    const color = COLOR_PALETTE[(p.itemNumber-1) % COLOR_PALETTE.length];
    const seamCss = bin ? palletFaceOverlayCss(bin, binTotal, ph, color, typeCount) : '';
    const notchesHtml = makePalletBaseNotchesHtml(pl, ph, heightMM, pw/2);
    const titleAttr = `title="${t('heightTooltipLabel')}: ${Math.round(heightMM)} mm"`;
    const topLayerColor = bin && bin.items.length ? blendedLayerColor(color, bin.items[bin.items.length-1].composition, typeCount) : color;
    html += `<div class="c3d-cube" style="width:${pl}px;height:${ph}px;transform:translate3d(${xPx}px, ${yTop}px, ${zCenter}px);" ${titleAttr}>`
      + makeBoxFacesHtml(pl,ph,pw,{
          front:  `background-color:${color};opacity:.94;border:1px solid rgba(0,0,0,.5);${seamCss}`,
          back:   `background-color:${color};opacity:.78;border:1px solid rgba(0,0,0,.5);${seamCss}`,
          left:   `background-color:${color};opacity:.62;border:1px solid rgba(0,0,0,.5);filter:brightness(.75);${seamCss}`,
          right:  `background-color:${color};opacity:.85;border:1px solid rgba(0,0,0,.5);filter:brightness(.92);${seamCss}`,
          top:    `background-color:${topLayerColor};opacity:1;border:1px solid rgba(0,0,0,.5);filter:brightness(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);`,
          bottom: ''
        })
      + notchesHtml
      + `</div>`;
  });

  // reference lines: one dashed horizontal plane per distinct item, at the height limit it was calculated against —
  // lets you visually confirm the pallet top sits at/under this line rather than assuming it reaches the ceiling
  heightLimitLines.forEach(({mm,color})=>{
    const yLine = Hpx - mm*scale;
    if(yLine<-1 || yLine>Hpx+1) return;
    html += `<div class="c3d-face" style="width:${Lpx}px;height:0;left:0;top:${yLine}px;border-top:1px dashed ${color};transform:translateZ(0px);opacity:.85;"></div>`;
    html += `<div class="c3d-face" style="width:${Wpx}px;height:0;left:${(Lpx-Wpx)/2}px;top:${yLine}px;border-top:1px dashed ${color};transform:rotateY(90deg) translateZ(${Lpx/2}px);opacity:.85;"></div>`;
  });

  world.innerHTML = html;

  // ---- drag-to-rotate ----
  let rotX = -22, rotY = -32;
  function applyRot(){ world.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`; }
  applyRot();

  // ---- zoom (mouse wheel + buttons) ----
  let zoom = 1;
  const ZOOM_MIN = 0.4, ZOOM_MAX = 4;
  function applyZoom(){
    zoomWrap.style.transform = `scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom*100)+'%';
  }
  function setZoom(z){ zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); applyZoom(); }
  applyZoom();
  viewport.addEventListener('wheel', e=>{
    e.preventDefault();
    setZoom(zoom * (e.deltaY<0 ? 1.12 : 1/1.12));
  }, {passive:false});
  overlay.querySelector('#c3d-zoom-in').onclick = ()=> setZoom(zoom*1.25);
  overlay.querySelector('#c3d-zoom-out').onclick = ()=> setZoom(zoom/1.25);
  overlay.querySelector('#c3d-zoom-reset').onclick = ()=> setZoom(1);

  let dragging = false, lastX=0, lastY=0;
  function startDrag(x,y){ dragging=true; lastX=x; lastY=y; viewport.classList.add('dragging'); }
  function moveDrag(x,y){
    if(!dragging) return;
    const dx = x-lastX, dy = y-lastY;
    lastX=x; lastY=y;
    rotY += dx*0.4;
    rotX -= dy*0.4;
    rotX = Math.max(-90, Math.min(90, rotX));
    applyRot();
  }
  function endDrag(){ dragging=false; viewport.classList.remove('dragging'); }

  viewport.addEventListener('mousedown', e=>{ startDrag(e.clientX, e.clientY); e.preventDefault(); });
  const onMouseMove = e=> moveDrag(e.clientX, e.clientY);
  const onMouseUp = ()=> endDrag();
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  let pinchDist = null;
  viewport.addEventListener('touchstart', e=>{
    if(e.touches.length===2){ pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
    else { const t=e.touches[0]; startDrag(t.clientX,t.clientY); }
  }, {passive:true});
  viewport.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(pinchDist){ setZoom(zoom * (d/pinchDist)); }
      pinchDist = d;
    } else {
      const t=e.touches[0]; moveDrag(t.clientX,t.clientY);
    }
  }, {passive:true});
  viewport.addEventListener('touchend', e=>{ pinchDist=null; endDrag(); });

  overlay.querySelectorAll('[data-view]').forEach(btn=>{
    btn.onclick = ()=>{
      const preset = VIEW3D_PRESETS[btn.dataset.view];
      if(preset){ rotX = preset.rx; rotY = preset.ry; applyRot(); }
    };
  });

  function closeModal(){
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
    overlay.remove();
  }
  overlay.querySelector('#c3d-close').onclick = closeModal;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
}

/* ============================================================
   ITEM MODAL
============================================================ */
function rowFitsPalletType(row, ptKey, heightLimit){
  const pt = PALLET_TYPES[ptKey];
  const usableHeight = heightLimit - PALLET_BASE_HEIGHT_MM;
  if(usableHeight<=0) return false;
  if(row.h>usableHeight) return false;
  return fitPerLayer(pt.l, pt.w, row.l, row.w).count>0;
}
function computeGroupResult(rows, ptKey, heightLimit){
  const tmp = { palletType:ptKey, mode:'boxes', boxTypes: rows.map(r=>({l:r.l,w:r.w,h:r.h,qty:r.qty})), heightLimit };
  const c = computeItem(tmp);
  if(c.invalid) return null;
  const totalBoxVolume = rows.reduce((s,r)=> s+r.l*r.w*r.h*r.qty, 0);
  const totalHeightUsed = (c.bins||[]).reduce((s,b)=> s+b.height+PALLET_BASE_HEIGHT_MM, 0);
  const util = totalHeightUsed>0 ? totalBoxVolume / (c.palletL*c.palletW*totalHeightUsed) : 0;
  return { ptKey, qty:c.qty, util };
}
function groupRowsOntoSharedPallets(rows, heightLimit){
  // Greedy set-cover: repeatedly find the pallet type covering the most still-unassigned rows,
  // then combine all rows that fit it into ONE shared multi-box-type item (reusing the existing
  // height-minimizing bin-packer) — this is what lets a short product's boxes fill the leftover
  // height on top of a tall product's layers instead of each getting its own dedicated pallet.
  const ptKeys = Object.keys(PALLET_TYPES).filter(k=>k!=='custom');
  let unassigned = rows.map((r,i)=> ({...r, _idx:i}));
  const groups = [];
  const noFit = [];
  while(unassigned.length){
    let bestKey = null, bestCover = [];
    ptKeys.forEach(ptKey=>{
      const covered = unassigned.filter(r=> rowFitsPalletType(r, ptKey, heightLimit));
      if(covered.length>bestCover.length){ bestCover = covered; bestKey = ptKey; }
    });
    if(!bestKey || !bestCover.length){
      noFit.push(...unassigned);
      break;
    }
    const result = computeGroupResult(bestCover, bestKey, heightLimit);
    if(!result){
      // combined set doesn't actually fit together even though each fits individually (rare edge
      // case) — fall back to placing this pallet type's rows one at a time so nothing gets lost
      bestCover.forEach(r=>{
        const single = computeGroupResult([r], bestKey, heightLimit);
        if(single) groups.push({ ptKey:bestKey, rows:[r], qty:single.qty, util:single.util });
        else noFit.push(r);
      });
    } else {
      groups.push({ ptKey:bestKey, rows:bestCover, qty:result.qty, util:result.util });
    }
    const coveredIdx = new Set(bestCover.map(r=>r._idx));
    unassigned = unassigned.filter(r=> !coveredIdx.has(r._idx));
  }
  return { groups, noFit };
}
function parseBulkImportLine(line){
  const parts = line.split(/\t|,/).map(s=>s.trim());
  if(parts.length<5) return null;
  const nums = parts.slice(parts.length-4);
  const desc = parts.slice(0, parts.length-4).join(', ');
  const [l,w,h,qty] = nums.map(v=> +v.replace(/[^\d.]/g,''));
  if(!desc || !(l>0) || !(w>0) || !(h>0) || !(qty>0)) return null;
  return { description:desc, l, w, h, qty:Math.round(qty) };
}
